name = "soller-ara-admin"
main = "admin-worker.js"
compatibility_date = "2026-09-16"

[triggers]
crons = ["*/15 * * * *"]

[vars]
ALLOWED_ORIGIN = "https://soller-ara.github.io"
GITHUB_OWNER = "soller-ara"
GITHUB_REPO = "soller-ara"
GITHUB_BRANCH = "main"

# NO escribas secretos aquí.
# Se configurarán como secrets:
# ADMIN_PASSWORD
# SESSION_SECRET
# GITHUB_TOKEN


# Estadísticas privadas (opcional):
# CF_ANALYTICS_ACCOUNT_ID: ID de la cuenta, no el token público del beacon.
# CF_ANALYTICS_API_TOKEN: secret con permiso Account Analytics:Read.
