name: Sóller Ara · recuperar cola del 7 de octubre
on:
  push:
    branches: [main]
    paths: [".github/workflows/recover-queue-20261007.yml"]
permissions:
  contents: read
  actions: write
concurrency:
  group: soller-ara-recovery-20261007
  cancel-in-progress: false
jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - name: Recuperar solo las ejecuciones detenidas identificadas
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/recover_queue_20261007.py
