name: Sóller Ara · editar contingut propi

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Escriu GUARDAR per confirmar'
        required: true
        type: string
      post_id:
        description: 'ID de la publicació pròpia'
        required: true
        type: string
      title:
        description: 'Títol (opcional para enlace incrustado)'
        required: false
        type: string
      body:
        description: 'Text (opcional para enlace incrustado)'
        required: false
        type: string
      category:
        description: 'Categoria'
        required: true
        type: choice
        options: [news, agenda, alerts, services, culture, sports, commerce, politics, social]
      language:
        description: 'Idioma'
        required: true
        type: choice
        options: [ca, es, en]
      image_url:
        description: 'URL pública de la imatge (opcional)'
        required: false
        type: string
      source_name:
        description: 'Nom de la font original'
        required: false
        type: string
      original_url:
        description: 'Enllaç https original'
        required: false
        type: string
      show_in_now:
        description: 'Mostrar també a Ara'
        required: false
        default: true
        type: boolean
      content_type:
        description: 'Tipus de publicació'
        required: false
        default: 'social_link'
        type: choice
        options: [own, social_link, event_poster]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "soller-ara-social-publish"
  queue: max
  cancel-in-progress: false

jobs:
  edit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Instal·lar Pillow
        run: python -m pip install pillow

      - name: Editar publicació
        env:
          EDIT_CONFIRMATION: ${{ inputs.confirmation }}
          POST_ID: ${{ inputs.post_id }}
          POST_TITLE: ${{ inputs.title }}
          POST_BODY: ${{ inputs.body }}
          POST_CATEGORY: ${{ inputs.category }}
          POST_LANGUAGE: ${{ inputs.language }}
          POST_IMAGE_URL: ${{ inputs.image_url }}
          POST_SOURCE_NAME: ${{ inputs.source_name }}
          POST_ORIGINAL_URL: ${{ inputs.original_url }}
          POST_CONTENT_TYPE: ${{ inputs.content_type }}
          EDIT_SHOW_IN_NOW: ${{ inputs.show_in_now }}
        run: python scripts/edit_own_post.py

      - name: Registrar activitat
        env:
          ACTIVITY_ACTION: edit
          ACTIVITY_AREA: publications
          ACTIVITY_TARGET_ID: ${{ inputs.post_id }}
          ACTIVITY_TITLE: ${{ inputs.title }}
          ACTIVITY_DETAIL: Publicación propia editada desde Administración
        run: python scripts/log_admin_action.py

      - name: Guardar canvis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/moderation.json data/manual_posts.json data/posts.json data/posts.js data/activity_log.json
          if [ -d noticies ]; then git add -A noticies; fi
          if [ -d assets/generated ]; then git add -A assets/generated; fi
          if git diff --cached --quiet; then
            echo "No hi ha canvis"
            exit 0
          fi
          git commit -m "editar: contingut propi de Sóller Ara"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    name: Deploy web pública després d'editar
    needs: edit
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout del main actualitzat
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
