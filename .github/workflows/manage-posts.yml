name: Sóller Ara · gestionar publicacions

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Acció'
        required: true
        type: choice
        options: [hide, unhide, delete-own, reclassify]
      post_id:
        description: 'ID de la publicació'
        required: true
        type: string
      category:
        description: 'Tipus nou (només per reclassify)'
        required: false
        type: choice
        options: [news, agenda, alerts, services, culture, sports, commerce]
      note:
        description: 'Compatibilitat API (no es desa)'
        required: false
        type: string
      confirmation:
        description: 'Escriu CONFIRMAR'
        required: true
        type: string

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  manage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Gestionar publicació
        env:
          MODERATION_ACTION: ${{ inputs.action }}
          POST_ID: ${{ inputs.post_id }}
          MODERATION_CONFIRMATION: ${{ inputs.confirmation }}
          MODERATION_CATEGORY: ${{ inputs.category }}
        run: python scripts/manage_posts.py

      - name: Registrar activitat
        env:
          ACTIVITY_ACTION: ${{ inputs.action }}
          ACTIVITY_AREA: moderation
          ACTIVITY_TARGET_ID: ${{ inputs.post_id }}
          ACTIVITY_DETAIL: Acción de moderación completada desde Administración
        run: python scripts/log_admin_action.py

      - name: Guardar canvis
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/moderation.json data/manual_posts.json data/posts.json data/posts.js data/activity_log.json
          if [ -d noticies ]; then git add -A noticies; fi
          if [ -d assets/generated ]; then git add -A assets/generated; fi
          if git diff --cached --quiet; then
            echo "No hi ha canvis"
            exit 0
          fi
          git commit -m "moderació: gestionar publicació"
          git pull --rebase origin main
          git push origin HEAD:main

  deploy:
    name: Deploy web pública després de moderar
    needs: manage
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout del main actualitzat
        uses: actions/checkout@v6
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
