name: Deploy Sóller Ara to GitHub Pages

on:
  push:
    branches:
      - main
    # Estas modificaciones ya despliegan desde el flujo de recopilación.
    paths-ignore:
      - "sources.json"
      - "social_distribution.json"
      - "scripts/update_sources.py"
      - "scripts/publication_state.py"
      - "scripts/retry_manual_social.py"
      - "scripts/reconcile_instagram_deliveries.py"
      - "scripts/prepare_collected_social.py"
      - "scripts/publish_collected_social.py"
      - "social_sources.json"
      - ".github/workflows/update-sources.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "soller-ara-social-publish"
  queue: max
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Preparar sitemap y metadatos de búsqueda
        run: python3 scripts/build_seo.py --output-dir "$RUNNER_TEMP/soller-ara-site"

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: ${{ runner.temp }}/soller-ara-site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: ./.github/actions/deploy-pages-reliable
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
