name: Sóller Ara · configurar distribució social

on:
  workflow_dispatch:
    inputs:
      change:
        description: Cambios de configuración
        required: true
        type: string
      request_id:
        description: Identificador de la petición
        required: true
        type: string
      confirmation:
        description: Escribe GUARDAR
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: "soller-ara-social-publish"
  queue: max
  cancel-in-progress: false

jobs:
  save:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Validar y guardar selección
        env:
          SOCIAL_SETTINGS_CHANGE: ${{ inputs.change }}
          SOCIAL_SETTINGS_REQUEST_ID: ${{ inputs.request_id }}
          SOCIAL_SETTINGS_CONFIRMATION: ${{ inputs.confirmation }}
        run: python scripts/manage_social_settings.py
      - name: Guardar resultado
        run: |
          git config user.name "soller-ara-bot"
          git config user.email "actions@users.noreply.github.com"
          git add social_distribution.json data/social_settings_results.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "social: guardar selección de Administración"
          git pull --rebase origin main
          git push origin HEAD:main
