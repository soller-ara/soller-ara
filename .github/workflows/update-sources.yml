name: Actualitzar fonts de Sóller Ara

on:
  workflow_dispatch:
  schedule:
    - cron: "7 * * * *"
  push:
    branches:
      - main
    paths:
      - "sources.json"
      - "social_distribution.json"
      - "scripts/update_sources.py"
      - "scripts/publication_state.py"
      - "scripts/retry_manual_social.py"
      - "scripts/prepare_collected_social.py"
      - "scripts/publish_collected_social.py"
      - "social_sources.json"
      - ".github/workflows/update-sources.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "soller-ara-social-publish"
  queue: max
  cancel-in-progress: false

jobs:
  update:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          ref: main

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Instal·lar Pillow
        run: python -m pip install pillow

      - name: Actualitzar fonts
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_IG_USER_ID: ${{ secrets.META_IG_USER_ID }}
          META_GRAPH_VERSION: "v26.0"
        run: python scripts/update_sources.py

      - name: Preparar cua social automàtica
        run: python scripts/prepare_collected_social.py

      - name: Guardar dades, cua i targetes
        run: |
          git config user.name "soller-ara-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/posts.json data/posts.js data/social_auto_queue.json
          if [ -d assets/generated/social ]; then git add -A assets/generated/social; fi
          if git diff --cached --quiet; then
            echo "No hi ha canvis a les dades o a la cua"
          else
            git commit -m "data: actualitzar fonts i cua social"
            git pull --rebase origin main
            git push origin HEAD:main
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_attempt }}
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}

      - name: Reintentar Instagram manual pendent
        id: manual_retry
        continue-on-error: true
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_GRAPH_VERSION: "v26.0"
        run: python scripts/retry_manual_social.py

      - name: Publicar cua a Facebook i Instagram
        id: social_publish
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_GRAPH_VERSION: "v26.0"
        run: python scripts/publish_collected_social.py

      - name: Guardar registre de distribució social
        if: ${{ always() && (steps.social_publish.outcome == 'success' || steps.social_publish.outcome == 'failure' || steps.manual_retry.outcome == 'success' || steps.manual_retry.outcome == 'failure') }}
        run: |
          git add data/social_publish_log.json
          if git diff --cached --quiet; then
            echo "No hi ha canvis al registre social"
            exit 0
          fi
          git config user.name "soller-ara-bot"
          git config user.email "actions@users.noreply.github.com"
          git commit -m "data: registrar distribució social automàtica"
          git pull --rebase origin main
          git push origin HEAD:main
