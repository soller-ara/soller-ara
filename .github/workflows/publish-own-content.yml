name: Sóller Ara · publicar contingut propi

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Escriu PUBLICAR per confirmar una publicació real'
        required: true
        type: string
      title:
        description: 'Títol'
        required: true
        type: string
      body:
        description: 'Text de la publicació'
        required: true
        type: string
      category:
        description: 'Categoria'
        required: true
        default: 'news'
        type: choice
        options: [news, agenda, alerts, services, culture, sports, commerce, politics, social]
      language:
        description: 'Idioma'
        required: true
        default: 'ca'
        type: choice
        options: [ca, es, en]
      image_url:
        description: 'URL pública de la imatge (opcional; si queda buida Sóller Ara genera una targeta automàtica)'
        required: false
        type: string
      source_name:
        description: 'Nom de la font original (opcional)'
        required: false
        type: string
      original_url:
        description: 'Enllaç https de la publicació original (opcional)'
        required: false
        type: string
      facebook:
        description: 'Publicar també a Facebook Sóller Ara'
        required: true
        default: false
        type: boolean
      instagram:
        description: 'Publicar també a Instagram @soller.ara'
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "soller-ara-own-publish"
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Instal·lar Pillow
        run: python -m pip install pillow

      - name: Crear publicació a Sóller Ara
        env:
          PUBLISH_CONFIRMATION: ${{ inputs.confirmation }}
          POST_TITLE: ${{ inputs.title }}
          POST_BODY: ${{ inputs.body }}
          POST_CATEGORY: ${{ inputs.category }}
          POST_LANGUAGE: ${{ inputs.language }}
          POST_IMAGE_URL: ${{ inputs.image_url }}
          POST_SOURCE_NAME: ${{ inputs.source_name }}
          POST_ORIGINAL_URL: ${{ inputs.original_url }}
        run: python scripts/add_own_post.py

      - name: Registrar activitat
        env:
          ACTIVITY_ACTION: publish
          ACTIVITY_AREA: publications
          ACTIVITY_TARGET_ID: ${{ env.OWN_POST_ID }}
          ACTIVITY_TITLE: ${{ inputs.title }}
          ACTIVITY_DETAIL: Publicación propia creada desde Administración
        run: python scripts/log_admin_action.py

      - name: Guardar publicació al repositori
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/manual_posts.json data/posts.json data/posts.js data/activity_log.json noticies
          git add assets/generated 2>/dev/null || true
          git commit -m "publicar: contingut propi de Sóller Ara"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: "."

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Comprovar que la notícia ja és pública
        if: ${{ inputs.facebook || inputs.instagram }}
        run: python scripts/wait_publication_ready.py

      - name: Publicar a xarxes seleccionades
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
          META_GRAPH_VERSION: "v26.0"
          PUBLISH_CONFIRMATION: ${{ inputs.confirmation }}
          POST_TITLE: ${{ inputs.title }}
          POST_BODY: ${{ inputs.body }}
          POST_IMAGE_URL: ${{ inputs.image_url }}
          POST_ORIGINAL_URL: ${{ inputs.original_url }}
          POST_SOURCE_NAME: ${{ inputs.source_name }}
          PUBLISH_FACEBOOK: ${{ inputs.facebook }}
          PUBLISH_INSTAGRAM: ${{ inputs.instagram }}
        run: python scripts/publish_own_social.py

      - name: Guardar registre de xarxes
        if: ${{ always() && (inputs.facebook || inputs.instagram) }}
        run: |
          git add data/social_publish_log.json
          if git diff --cached --quiet; then
            echo "No hi ha canvis al registre social"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "data: registrar distribució social"
          git pull --rebase origin main
          git push origin HEAD:main
