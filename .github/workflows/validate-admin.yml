name: Validar Administración Sóller Ara

on:
  push:
    branches:
      - main
    paths:
      - "admin/**"
      - "worker/**"
      - "social_distribution.json"
      - "scripts/activity_log.py"
      - "scripts/log_admin_action.py"
      - "scripts/edit_own_post.py"
      - "scripts/add_own_post.py"
      - "scripts/publish_own_social.py"
      - "scripts/manage_sources.py"
      - "scripts/manage_social_settings.py"
      - "scripts/update_sources.py"
      - "sources.json"
      - "scripts/prepare_collected_social.py"
      - "scripts/publish_collected_social.py"
      - "tests/test_social_distribution.py"
      - "tests/test_source_collection.py"
      - "tests/test_social_settings.py"
      - "tests/test_admin_analytics.mjs"
      - ".github/workflows/publish-own-content.yml"
      - ".github/workflows/edit-own-content.yml"
      - ".github/workflows/manage-posts.yml"
      - ".github/workflows/manage-sources.yml"
      - ".github/workflows/manage-social-settings.yml"
      - ".github/workflows/update-sources.yml"
      - ".github/workflows/validate-admin.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configurar Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Configurar Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Validar JavaScript
        run: |
          node --check admin/public-data.js
          node --check admin/admin.js
          node --check admin/sources-v2.js
          node --check admin/visits-v1.js
          node tests/test_admin_analytics.mjs
          node --check admin/activity-v1.js
          node --check admin/social-auto-v1.js
          node --check worker/admin-worker.js
          node --check admin/config.js

      - name: Validar scripts de Administración y redes
        run: |
          python -m py_compile scripts/add_own_post.py
          python -m py_compile scripts/edit_own_post.py
          python -m py_compile scripts/publish_own_social.py
          python -m py_compile scripts/manage_sources.py
          python -m py_compile scripts/manage_social_settings.py
          python -m py_compile scripts/activity_log.py
          python -m py_compile scripts/log_admin_action.py
          python -m py_compile scripts/prepare_collected_social.py
          python -m py_compile scripts/publish_collected_social.py
          python -m json.tool social_distribution.json >/dev/null
          python -m json.tool data/social_settings_results.json >/dev/null

      - name: Comprovar selecció i reintents socials sense publicar
        run: |
          python -m pip install pillow
          python -m unittest discover -s tests -v

      - name: Verificar que no hay secretos en Wrangler
        run: |
          if grep -Eq '^(ADMIN_PASSWORD|SESSION_SECRET|GITHUB_TOKEN)\s*=' worker/wrangler.toml; then
            echo "ERROR: se ha encontrado un secreto escrito en wrangler.toml"
            exit 1
          fi
          echo "OK: no hay secretos escritos en configuración pública"

