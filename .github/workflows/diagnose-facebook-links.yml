name: Meta · diagnòstic d’enllaços sense publicar

on:
  push:
    branches: [diagnostico-enlaces-facebook-20261124]
    paths:
      - scripts/diagnose_facebook_link_readonly.py
      - tests/test_meta_link_diagnostic.py
      - .github/workflows/diagnose-facebook-links.yml

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Validar diagnóstico sin conexiones externas
        run: python -m unittest discover -s tests -p test_meta_link_diagnostic.py -v
      - name: Consultar enlaces y adjuntos mediante GET
        env:
          META_ACCESS_TOKEN: ${{ secrets.META_ACCESS_TOKEN }}
        run: python scripts/diagnose_facebook_link_readonly.py
